schema_version: "1.0"

plugin:
  id: "finance"
  name: "Finance & Business Analysis Assistant"
  version: "1.0.0"
  description: "Financial statement analysis, quantitative business modeling, and regulatory filing evaluation."
  publisher: "unimind-core"

compatibility:
  unimind_min_version: "1.0.0"

capabilities:
  - financial_modeling
  - ratio_analysis
  - earnings_synthesis

instructions:
  path: "instructions.md"

models:
  required:
    - text_generation
  preferred:
    - structured_output

retrieval:
  enabled: true
  collection_scope: "tenant"
  top_k: 8
  reranking: true
  citation_required: true

tools:
  allowed:
    - "dcf_calculator"
  approval_required:
    - "ledger_mutation"

permissions:
  network: "restricted"
  file_access: "knowledge_base_only"
  code_execution: false

safety:
  mode: "advisory"
  require_evidence_for_security_findings: false
